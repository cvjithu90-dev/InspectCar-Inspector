name: Build InspectCar Inspector APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Copy Web App Assets into Android Project
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/
          cp manifest.json android/app/src/main/assets/
          cp sw.js android/app/src/main/assets/

      - name: Grant Execute Permission for Gradlew
        run: |
          cd android
          gradle wrapper
          chmod +x gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/InspectCar-Inspector.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: InspectCar-Inspector-APK
          path: build-output/InspectCar-Inspector.apk
          retention-days: 90

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest-apk
          name: InspectCar Inspector Android App (APK)
          body: |
            ## 📱 InspectCar Inspector Android App
            
            Download and install the latest APK file directly on your Android phone.
            
            - **App Name**: InspectCar Inspector
            - **Version**: 1.0.0
            - **Package**: `in.inspectcar.inspector`
            - **Web App**: https://inspector.inspectcar.in
            
            ### How to Install:
            1. Download `InspectCar-Inspector.apk` below to your phone.
            2. Tap on the downloaded file and select **Install** (allow "Install from Unknown Sources" if prompted).
            3. Open the app and log in with your inspector credentials!
          files: build-output/InspectCar-Inspector.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
